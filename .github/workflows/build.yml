name: Build Geode Mod

on:
  # Build on every push...
  push:
    branches: ['**']
  # ...and let you trigger it manually from the Actions tab.
  workflow_dispatch:

jobs:
  # Logic that doesn't need GD (window extender engine) is tested on its own.
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Window extender engine
        run: |
          g++ -std=c++20 -Wall -Wextra -I src tests/assist_test.cpp -o assist_test
          ./assist_test

  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We only target Win64, so there is nothing to merge. The separate
      # combine job used to pass a single package straight through; upstream
      # now rejects that ("Merging requires at least two packages"), so the
      # .geode is uploaded directly from here instead.
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: futuremod-geode
          path: ${{ steps.build.outputs.build-output }}
